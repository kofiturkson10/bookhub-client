<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Böcker</h1>
    <a routerLink="/books/new" class="btn btn-primary">
      <i class="fa-solid fa-plus"></i> Lägg till ny bok
    </a>
  </div>

  @if (books.length == 0) {
    <p class="text-muted">Inga böcker än</p>
  } @else {
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>Titel</th>
            <th>Författare</th>
            <th>Publicerad</th>
            <th class="text-end">Åtgärder</th>
          </tr>
        </thead>
        <tbody>
          @for (book of books; track book.id) {
            <tr>
              <td>{{ book.title }}</td>
              <td>{{ book.author }}</td>
              <td>{{ book.publishedDate | date:'yyyy-MM-dd' }}</td>
              <td class="text-end">
                <a [routerLink]="['/books', book.id, 'edit']"
                   class="btn btn-sm btn-outline-primary me-1">
                  <i class="fa-solid fa-pen"></i> Redigera
                </a>
                <button (click)="deleteBook(book.id)"
                        class="btn btn-sm btn-outline-danger">
                  <i class="fa-solid fa-trash"></i> Radera
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
