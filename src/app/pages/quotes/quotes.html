<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Mina citat</h1>
    <button type="button" (click)="openAdd()" class="btn btn-primary">
      <i class="fa-solid fa-plus"></i> Lägg till citat.
    </button>
  </div>

  @if (showAddModal()) {
    <div class="app-modal" (click)="closeAdd()">
      <div class="app-modal__panel" (click)="$event.stopPropagation()">
        <div class="app-modal__header">
          <h2 class="app-modal__title">Nytt citat</h2>
          <button type="button" class="app-modal__close"
                  (click)="closeAdd()" aria-label="Stäng">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="app-modal__body">
          @if (addError()) {
            <div class="alert alert-danger" role="alert">{{ addError() }}</div>
          }

          <form [formGroup]="addForm" (ngSubmit)="submitAdd()">
            <div class="mb-3">
              <label for="quote-text" class="form-label">Citat</label>
              <textarea id="quote-text" formControlName="text" class="form-control"
                        rows="3" maxlength="500"></textarea>
            </div>

            <div class="mb-3">
              <label for="quote-author" class="form-label">Författare</label>
              <input id="quote-author" type="text" formControlName="author"
                     class="form-control" maxlength="100" />
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" (click)="closeAdd()">
                Avbryt
              </button>
              <button type="submit" class="btn btn-primary"
                      [disabled]="addForm.invalid || saving()">
                <i class="fa-solid fa-plus"></i>
                {{ saving() ? 'Sparar…' : 'Spara' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  }

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  @if (quotes().length === 0) {
    <p class="text-muted">Inga citat än.</p>
  } @else {
    <div class="row g-3">
      @for (quote of quotes(); track quote.id) {
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <blockquote class="blockquote mb-3">
                <p class="mb-0">
                  <i class="fa-solid fa-quote-left text-muted me-1"></i>
                  {{ quote.text }}
                </p>
              </blockquote>
              <footer class="blockquote-footer mt-auto mb-3">
                {{ quote.author }}
              </footer>
              <div class="d-flex justify-content-end gap-2">
                <a [routerLink]="['/quotes', quote.id, 'edit']"
                   class="btn btn-sm btn-outline-primary">
                  <i class="fa-solid fa-pen"></i>
                </a>
                <button (click)="deleteQuote(quote.id)"
                        class="btn btn-sm btn-outline-danger">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
