<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="mb-4">{{ bookId ? 'Redigera bok' : 'Lägg till bok' }}</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">Titel</label>
          <input id="title" type="text" formControlName="title" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">Författare</label>
          <input id="author" type="text" formControlName="author" class="form-control" />
        </div>

        <div class="mb-3">
          <label for="publishedDate" class="form-label">Publiceringsdatum</label>
          <input id="publishedDate" type="date" formControlName="publishedDate" class="form-control" />
        </div>

        <div class="d-flex gap-2">
          <button type="submit" [disabled]="form.invalid" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Spara
          </button>
          <a routerLink="/books" class="btn btn-outline-secondary">Avbryt</a>
        </div>
      </form>
    </div>
  </div>
